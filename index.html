<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyPlan · 나의 라이프 플래너</title>
<meta name="description" content="목표·일정·자산·공모주·라이프 플랜을 한 곳에서 관리하는 개인 대시보드">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 30'%3E%3Cpath d='M4 26 L14 5 L23 18 L32 5 L42 26' fill='none' stroke='%234f7cf7' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fa;--card:#fff;--tx:#1a2233;--mut:#7a8499;--bd:#e8ecf3;--soft:#f5f7fb;--pri:#3b7cf5;--pri2:#eaf1fe;--grn:#20a464;--org:#f97316;--pur:#8b5cf6;--red:#e5484d;--amb:#b54708;--sh:0 2px 12px rgba(31,52,94,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.15em}
.app{display:flex;min-height:100vh}
/* sidebar */
aside{width:130px;flex:none;background:linear-gradient(180deg,#24314f,#182139);color:#c4cde0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 10px 18px;z-index:30}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:26px;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.side-nav{display:flex;flex-direction:column;gap:6px}
.side-nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;color:#c4cde0;text-decoration:none;font-size:13.5px;white-space:nowrap}
.side-nav a svg{font-size:17px}
.side-nav a:hover{background:rgba(255,255,255,.06)}
.side-nav a.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(59,124,245,.35)}
.me{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:13px;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#5b8ff9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.7);font-size:14px}
.me small{color:#8f9bb5;font-size:11px}
/* main */
.main{flex:1;min-width:0;padding:22px 26px 30px}
.topbar{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.tb-l{flex:1;min-width:0}
.tb-l h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.3px}
.tb-l p{margin:4px 0 0;color:var(--mut)}
.tb-r{display:flex;align-items:center;gap:10px}
.search{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:22px;padding:8px 14px;width:250px;box-shadow:var(--sh)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.search>svg{color:var(--mut);font-size:17px}
.cbtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh);font-size:19px}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-style:normal;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.badge.on{display:flex}
.rel{position:relative}
.dd{position:absolute;top:calc(100% + 8px);right:0;width:330px;max-height:420px;overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 14px 40px rgba(20,30,60,.16);z-index:40;display:none;padding:6px}
.dd.on{display:block}
.dd .di{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}
.dd .di:hover{background:var(--soft)}
.dd .dh{font-size:11px;color:var(--mut);padding:8px 10px 2px;font-weight:500}
.dd .de{padding:18px;text-align:center;color:var(--mut)}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.ch{display:flex;align-items:center;margin-bottom:12px}
.ch h3{margin:0;flex:1}
.ch a,.more-link{color:var(--mut);font-size:12.5px;cursor:pointer;text-decoration:none}
.ch a:hover{color:var(--pri)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.btn.p:hover{background:#2f6be0}
.btn.s{padding:4px 9px;font-size:12px}
.btn.d{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--tx)}
.ib:hover{background:var(--soft)}
.seg,.seg2{display:inline-flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.seg button,.seg2 button{border:0;background:transparent;padding:6px 16px;border-radius:8px;cursor:pointer;color:var(--mut)}
.seg button.on,.seg2 button.on{background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(59,124,245,.3)}
.mut{color:var(--mut)}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--red)}.neg{color:#1570ef}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--mut);white-space:nowrap;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.bar{height:7px;border-radius:4px;background:#edf1f7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--pri)}
.empty{padding:18px;text-align:center;color:var(--mut)}
/* home */
.home-top{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:16px;margin-bottom:16px}
.kcard{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh);display:flex;gap:16px;align-items:flex-start;cursor:pointer}
.kcard.peach{background:linear-gradient(135deg,#fff6ef,#ffeee2);border-color:#fde3cf}
.kic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.kb{flex:1;min-width:0}
.kl{font-size:13px;color:#4a5468;font-weight:500}
.kv{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:2px 0 8px;line-height:1.2}
.kv small{font-size:17px;font-weight:700;margin-left:2px}
.kv .of{font-size:18px;color:var(--tx)}
.kfoot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#4a5468}
.kfoot .bar{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#fff;border:1px solid #fbd5bb;color:#c2410c;border-radius:14px;padding:3px 10px}
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:128px;box-shadow:var(--sh);cursor:pointer}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hq{position:relative;padding:20px 22px;font-family:'Nanum Pen Script',cursive;color:#1d2433}
.hq .q{font-size:27px;line-height:1.15;white-space:pre-line}
.hq .qs{font-size:18px;margin-top:8px;color:#2a3142}
.home-main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.hr2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.mg{display:flex;gap:12px;align-items:center;padding:9px 0;cursor:pointer}
.mg .gi{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.mg .gb{flex:1;min-width:0}
.mg .gt{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .gd{font-size:11.5px;color:var(--mut)}
.mg .gp{display:flex;align-items:center;gap:8px;margin-top:5px}
.mg .gp .bar{flex:1;height:6px}
.mg .gp span{font-size:12px;width:34px;text-align:right}
.sumrow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.sumrow svg{color:var(--pri);font-size:17px}
.sumrow b{margin-left:auto;font-weight:700}
.donut{display:flex;justify-content:center;margin-top:12px}
/* todo */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:8px;padding:6px 2px}
.todo label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.todo input{appearance:none;-webkit-appearance:none;width:19px;height:19px;border-radius:50%;border:1.6px solid #b8c1d1;margin:0;flex:none;cursor:pointer;display:grid;place-content:center;background:#fff}
.todo input:checked{background:var(--pri);border-color:var(--pri)}
.todo input:checked::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.todo li.done .tt{text-decoration:line-through;color:var(--mut)}
.todo .tx{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;opacity:0;padding:0 4px}
.todo li:hover .tx{opacity:1}
.tadd input{width:100%;border:1px dashed var(--bd);border-radius:9px;padding:7px 10px;margin-top:6px;background:var(--soft);outline:none}
.tadd input:focus{border-style:solid;border-color:var(--pri);background:#fff}
/* week chart */
.wchart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.wchart .wc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.wchart .bp{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.wchart .bp i{width:40%;max-width:16px;border-radius:4px 4px 0 0;display:block}
.wchart .bp i.a{background:#dbe7fd}.wchart .bp i.b{background:var(--pri)}
.wchart .wl{font-size:11.5px;margin-top:5px;text-align:center;line-height:1.3}
.wchart .wl small{display:block;color:var(--mut);font-size:10.5px}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut)}
.lg span{display:inline-flex;align-items:center;gap:5px}
/* calendar card */
.cal-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-top .ct{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.cal-nav{display:flex;align-items:center;gap:2px;margin-left:16px}
.ym{border:0;background:transparent;font-weight:700;font-size:16px;cursor:pointer;padding:4px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.ym:hover{background:var(--soft)}
.cal-top .sp{flex:1}
.tg{border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.tg-row{display:grid}
.tg-head>div{padding:6px 2px;text-align:center;font-size:12px;color:#4a5468;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);cursor:pointer}
.tg-head>div:first-child{border-left:0;cursor:default}
.tg-head b{display:block;font-size:13px;font-weight:500;color:var(--tx)}
.tg-head .today{background:#eaf1fe;color:var(--pri)}.tg-head .today b{color:var(--pri);font-weight:700}
.tg-head .sun,.tg-head .sun b{color:#e5484d}.tg-head .sat,.tg-head .sat b{color:#3e63dd}
.tg-all>div{border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:3px;min-height:26px}
.tg-all>div:first-child{border-left:0;font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.tg-all .today{background:#f3f7ff}
.tg-scroll{overflow-y:auto;position:relative}
.tg-body{display:grid;position:relative}
.tg-gut{position:relative}
.tg-gut div{position:absolute;right:8px;font-size:11px;color:var(--mut);transform:translateY(-50%)}
.tg-gut div:first-child{display:none}
.tg-col{position:relative;border-left:1px solid var(--bd);cursor:copy}
.tg-col.today{background:#f3f7ff}
.tev{position:absolute;border-radius:6px;border-left:3px solid;padding:3px 6px;font-size:11.5px;overflow:hidden;cursor:pointer;line-height:1.3;color:#1a2233}
.tev b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev span{display:block;color:#4a5468;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev.done{opacity:.5}.tev.done b{text-decoration:line-through}
.tev:hover{filter:brightness(.97);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.chip{display:block;font-size:11px;padding:1px 6px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;cursor:pointer;color:#1a2233}
.chip.done{text-decoration:line-through;opacity:.55}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.mcal .dow{padding:6px;text-align:center;font-size:12px;color:#4a5468;background:var(--soft);border-bottom:1px solid var(--bd)}
.mcal .d{padding:4px;border-top:1px solid var(--bd);border-left:1px solid var(--bd);cursor:pointer;overflow:hidden;min-width:0}
.mcal .d:nth-child(7n+1){border-left:0}
.mcal .d:hover{background:var(--soft)}
.mcal .d.out{opacity:.4}
.mcal .d .n{font-size:12px;font-weight:500;display:inline-block;min-width:22px;text-align:center;border-radius:11px;margin-bottom:2px}
.mcal .d.today{background:#f3f7ff}
.mcal .d.today .n{background:var(--pri);color:#fff}
.mcal .sun .n,.mcal .dow.sun{color:#e5484d}.mcal .sat .n,.mcal .dow.sat{color:#3e63dd}
.mcal .more{font-size:11px;color:var(--mut)}
/* lists, tables */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd)}
.list li:last-child{border-bottom:0}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.ggrid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--bd)}
.goal:last-child{border-bottom:0}
.goal .body{flex:1;min-width:0}
.goal .t{font-weight:500}
.goal.done .t{text-decoration:line-through;color:var(--mut)}
.goal input[type=range]{width:100%;accent-color:var(--pri)}
textarea.note{width:100%;min-height:120px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fff;resize:vertical}
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px 18px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--mut)}.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mut)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft);margin:6px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:500;background:var(--soft);white-space:nowrap}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tfoot td{font-weight:700;border-bottom:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px;border-bottom:1px solid var(--bd)}
.bars .b{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;max-width:36px;background:var(--pri);border-radius:5px 5px 0 0}
.bars .b i.n{background:var(--red)}
.bars .b small{font-size:10px;color:var(--mut);margin-top:2px;white-space:nowrap}
.st{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters button{border:1px solid var(--bd);background:#fff;border-radius:14px;padding:3px 11px;font-size:12px;cursor:pointer}
.filters button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:14px;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:#edf1f7;display:block}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow-y:auto}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 14px;font-size:17px;display:flex;align-items:center}
.mbox h2 .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);grid-column:span 2}
.form label.h{grid-column:span 1}
.form label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:14px}
.form input:not([type=checkbox]),.form select,.form textarea{border:1px solid var(--bd);border-radius:9px;padding:8px 10px;background:#fff;color:var(--tx);font-size:14px;width:100%}
.form textarea{min-height:64px;resize:vertical}
.form .hint{font-size:11px;color:var(--mut)}
.mfoot{display:flex;gap:8px;margin-top:16px}
.mfoot .sp{flex:1}
.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk button{padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fff;cursor:pointer}
.pk button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60;flex-direction:column;gap:8px;text-align:center;padding:20px}
#loading.off{display:none}
.spin{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#auth{position:fixed;inset:0;z-index:58;display:none;background:linear-gradient(135deg,#dfeafb,#c9dcf7 50%,#b8d0f5)}
#auth.on{display:flex}
.au-hero{position:relative;flex:1.35;min-width:0;overflow:hidden;color:#fff}
.au-bg{position:absolute;inset:0;width:100%;height:100%}
.au-logo{position:absolute;top:38px;left:48px;display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;letter-spacing:-.3px}
.au-copy{position:absolute;top:22%;left:48px;right:30px}
.au-copy h1{margin:0;font-size:clamp(28px,3.1vw,42px);line-height:1.38;font-weight:700;letter-spacing:-.5px;text-shadow:0 2px 14px rgba(0,20,60,.3)}
.au-copy em{font-style:normal;color:#8fd0ff}
.au-hr{display:block;width:34px;height:2px;background:#fff;margin:24px 0 20px;opacity:.85}
.au-copy p{margin:0;font-size:clamp(15px,1.3vw,18px);line-height:1.7;opacity:.95;text-shadow:0 1px 8px rgba(0,20,60,.35)}
.au-feats{position:absolute;left:48px;bottom:44px;display:flex;gap:0}

let sb=null,sbUser=null,rtChannel=null,recovering=false;
function normalize(k,d){const o=clone(DEFAULTS[k]);if(d&&typeof d==='object')for(const key in o){if(d[key]!==undefined)o[key]=d[key]}return o}
function save(k){
  if(mode!=='db')return;
  dirty[k]=true;setStatus('저장 중…');
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),500);
}
async function flush(k){
  if(inflight[k]){timers[k]=setTimeout(()=>flush(k),300);return}
  if(!sbUser)return;
  dirty[k]=false;inflight[k]=true;
  const row={user_id:sbUser.id,doc:k,data:clone(S[k]),updated_at:new Date().toISOString()};
  try{
    let {error}=await sb.from('user_docs').upsert(row);
    if(error){await sleep(800+Math.random()*900);({error}=await sb.from('user_docs').upsert(row))}
    if(error)throw error;
    if(!Object.values(dirty).some(Boolean))setStatus('저장됨 ✓');
  }catch(e){dirty[k]=true;setStatus('저장 실패 — 다음 변경 시 재시도','err');console.error(e)}
  finally{inflight[k]=false}
}
window.addEventListener('beforeunload',e=>{if(Object.values(dirty).some(Boolean)||Object.values(inflight).some(Boolean)){e.preventDefault();e.returnValue=''}});

function showLoading(msg){$('#loadmsg').innerHTML=msg||'데이터를 불러오는 중…';$('#loading').classList.remove('off')}
async function loadData(){
  showLoading();
  const {data,error}=await sb.from('user_docs').select('doc,data').eq('user_id',sbUser.id);
  if(error){showLoading('데이터를 불러오지 못했습니다.<br><span class="mut">'+esc(error.message)+'</span><br><br><button class="btn" onclick="location.reload()">다시 시도</button>');return false}
  S=clone(DEFAULTS);
  const have={};(data||[]).forEach(r=>{if(DEFAULTS[r.doc]){S[r.doc]=normalize(r.doc,r.data);have[r.doc]=1}});
  if(!have.settings){const nm=(sbUser.user_metadata&&sbUser.user_metadata.name)||(sbUser.email||'').split('@')[0];S.settings.name=nm||'나';mode='db';save('settings')}
  mode='db';
  subscribeRealtime();
  return true;
}
function subscribeRealtime(){
  if(rtChannel){sb.removeChannel(rtChannel);rtChannel=null}
  rtChannel=sb.channel('docs-'+sbUser.id).on('postgres_changes',{event:'*',schema:'public',table:'user_docs',filter:'user_id=eq.'+sbUser.id},p=>{
    const r=p.new;if(!r||!r.doc||!DEFAULTS[r.doc])return;
    if(dirty[r.doc]||inflight[r.doc])return;
    const nv=normalize(r.doc,r.data);
    if(JSON.stringify(nv)===JSON.stringify(S[r.doc]))return;
    S[r.doc]=nv;renderAll(true);
  }).subscribe();
}
let starting=null;
async function startSession(user){
  if(recovering||starting===user.id)return;
  if(sbUser&&mode==='db'&&sbUser.id===user.id){hideAuth();return}
  sbUser=user;hideAuth();starting=user.id;
  try{if(await loadData()){$('#loading').classList.add('off');setStatus('동기화됨 ✓');lastAct=Date.now();renderAll()}}finally{starting=null}
}
function endSession(){
  if(rtChannel){sb.removeChannel(rtChannel);rtChannel=null}
  sbUser=null;mode='auth';S=clone(DEFAULTS);
  Object.keys(dirty).forEach(k=>dirty[k]=false);
  closeModal();$('#page').innerHTML='';$('#loading').classList.add('off');showAuth('login');
}
async function init(){
  route();
  const cfg=window.MYPLAN_CONFIG||{};
  if(!window.supabase||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_URL.includes('YOUR-')){
    showLoading('<b>Supabase 설정이 필요합니다</b><br><span class="mut">config.js 파일에 SUPABASE_URL과 SUPABASE_ANON_KEY를 입력해 주세요.<br>자세한 방법은 README.md를 참고하세요.</span>');
    $('.spin').style.display='none';return;
  }
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;$('#loading').classList.add('off');showAuth('reset2');return}
    if(ev==='SIGNED_OUT'){if(mode!=='auth')endSession();return}
    if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION')&&session&&!recovering)setTimeout(()=>startSession(session.user),0);
    if(ev==='USER_UPDATED'&&session){sbUser=session.user;if(curTab==='settings'&&mode==='db')renderAll()}
  });
  // '로그인 상태 유지'를 끄고 로그인했다면, 브라우저를 새로 열었을 때 로그아웃
  try{if(localStorage.getItem('pdash_nokeep')==='1'&&!sessionStorage.getItem('pdash_alive')){localStorage.removeItem('pdash_nokeep');await sb.auth.signOut({scope:'local'})}}catch(e){}
  const {data:{session}}=await sb.auth.getSession();
  if(/access_token|error_description|type=/.test(location.hash)){history.replaceState(null,'',location.pathname+location.search);route()}
  if(recovering)return;
  if(session)await startSession(session.user);
  else{mode='auth';$('#loading').classList.add('off');showAuth(location.search.includes('signup')?'signup':'login')}
}

function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-ys)/864e5+1)/7)}
function periodOf(scope,a){
  if(scope==='week'){const mo=monday(a),su=new Date(mo);su.setDate(mo.getDate()+6);const th=new Date(mo);th.setDate(mo.getDate()+3);
    const wom=Math.ceil(th.getDate()/7);
    return {key:'W:'+fmtD(mo),label:`${th.getFullYear()}년 ${th.getMonth()+1}월 ${wom}주차`,sub:`${md(fmtD(mo))}(월) ~ ${md(fmtD(su))}(일) · ${isoWeek(mo)}주`,parent:{scope:'month',a:th}}}
  if(scope==='month')return {key:`M:${a.getFullYear()}-${pad(a.getMonth()+1)}`,label:`${a.getFullYear()}년 ${a.getMonth()+1}월`,sub:'',parent:{scope:'year',a}};
  return {key:'Y:'+a.getFullYear(),label:`${a.getFullYear()}년`,sub:'',parent:null};
}
function shiftAnchor(scope,a,n){const x=new Date(a);if(scope==='week')x.setDate(x.getDate()+7*n);else if(scope==='month'){x.setDate(1);x.setMonth(x.getMonth()+n)}else x.setFullYear(x.getFullYear()+n);return x}

function optList(o){return (o||[]).map(x=>typeof x==='string'?{v:x,l:x}:x)}
function fieldHTML(f,v){
  const show=f.show?' data-show="1"':'';
  if(f.t==='sec')return `<div class="fsec" data-fk="${f.k||''}"${show}>${ic(f.ic||'layers')}<span>${esc(f.l)}</span>${f.d?`<em>${esc(f.d)}</em>`:''}</div>`;
  if(v==null||v==='')v=f.def??'';
  const span=f.t==='check'?'ck':(f.h?'h':'');
  const lab=`<span class="fl">${ic(f.ic||FDEF_IC[f.t]||'note')}<span class="ft">${esc(f.l)}</span>${f.req?'<b class="rq">*</b>':''}${f.opt?'<span class="op">(선택)</span>':''}</span>`;
  const ph=f.ph?` placeholder="${esc(f.ph)}"`:'';
  const list=f.list?` list="${f.list}"`:'';
  let inp;
  switch(f.t){
    case 'area':inp=`<div class="fwrap"><textarea name="${f.k}"${ph}${f.max?` maxlength="${f.max}" data-max="${f.max}"`:''}>${esc(v)}</textarea>${f.max?`<span class="cnt">${String(v).length}/${f.max}</span>`:''}</div>`;break;
    case 'sel':inp=`<select name="${f.k}">${optList(f.o).map(o=>`<option value="${esc(o.v)}"${o.v===v?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`;break;
    case 'cards':inp=`<div class="cards" data-for="${f.k}">${optList(f.o).map(o=>`<button type="button" class="card-opt${o.v===v?' on':''}" data-v="${esc(o.v)}"${o.c?` style="--cc:${o.c}"`:''}>${o.ic?ic(o.ic,20):''}<b>${esc(o.l)}</b>${o.d?`<small>${esc(o.d)}</small>`:''}</button>`).join('')}</div><input type="hidden" name="${f.k}" value="${esc(v)}">`;break;
    case 'chips':inp=`<div class="chips" data-for="${f.k}"${f.free?' data-free="1"':''}>${optList(f.o).map(o=>`<button type="button" class="chip-opt${o.v===v?' on':''}" data-v="${esc(o.v)}"${o.c?` style="--cc:${o.c}"`:''}>${o.c?'<i></i>':''}${o.e?o.e+' ':''}${esc(o.l)}</button>`).join('')}</div>${f.free?'':`<input type="hidden" name="${f.k}" value="${esc(v)}">`}`;break;
    case 'check':return `<label class="ck tgl" data-fk="${f.k}"${show}><input type="checkbox" name="${f.k}"${v?' checked':''}><i></i><span>${esc(f.l)}${f.hint?`<small>${esc(f.hint)}</small>`:''}</span></label>`;
    case 'money':inp=`<input name="${f.k}" inputmode="numeric" data-money value="${v===''?'':esc(won(v))}"${ph}>`;break;
    case 'num':inp=`<input type="number" name="${f.k}" value="${esc(v)}"${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''} step="${f.step||'any'}"${ph}>`;break;
    case 'html':return `<div class="fhtml ${f.h?'h':''}" data-fk="${f.k}"${show}>${f.html||''}</div>`;
    default:inp=`<div class="fwrap"><input type="${f.t}" name="${f.k}" value="${esc(v)}"${ph}${list}${f.max?` maxlength="${f.max}" data-max="${f.max}"`:''} autocomplete="off">${f.max?`<span class="cnt">${String(v).length}/${f.max}</span>`:''}</div>`;
  }
  return `<label class="${span}" data-fk="${f.k}"${show}>${lab}${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</label>`;
}
function readForm(root,fields){
  const o={};
  for(const f of fields){
    if(f.t==='sec'||f.t==='html'||f.free)continue;
    const el=root.querySelector(`[name="${f.k}"]`);if(!el)continue;
    if(f.t==='check')o[f.k]=el.checked;
    else if(f.t==='money'||f.t==='num'){const s=String(el.value).replace(/[^0-9.\-]/g,'');o[f.k]=s===''||s==='-'?null:Number(s)}
    else o[f.k]=el.value.trim();
  }
  return o;
}
function modalHead(title,o={}){
  const c=o.color||'#3b7cf5';
  return `<div class="mh" style="--c:${c}"><div class="mi">${ic(o.icon||'note',26)}</div><div class="mt"><h2>${esc(title)}</h2>${o.sub?`<p>${esc(o.sub)}</p>`:''}</div><button class="x" data-act="close" title="닫기">${ic('x',20)}</button></div>`;
}
function openModal(title,html,mount,o={}){
  const box=$('#mbox');box.style.setProperty('--c',o.color||'#3b7cf5');
  box.innerHTML=modalHead(title,o)+html;
  $('#modal').classList.add('on');
  box.querySelectorAll('[data-money]').forEach(el=>el.addEventListener('input',()=>{const neg=el.value.trim().startsWith('-');const d=el.value.replace(/[^0-9]/g,'');el.value=d?(neg?'-':'')+Number(d).toLocaleString('ko-KR'):(neg?'-':'')}));
  box.querySelectorAll('[data-max]').forEach(el=>el.addEventListener('input',()=>{const c=el.parentElement.querySelector('.cnt');if(c)c.textContent=el.value.length+'/'+el.dataset.max}));
  mount&&mount(box);
  if(!o.noFocus&&!(window.matchMedia&&matchMedia('(pointer: coarse)').matches)){const first=box.querySelector('.form input:not([type=hidden]):not([type=checkbox]),.form textarea');first&&setTimeout(()=>first.focus(),40)}
}
function openForm({title,sub,icon,color,fields,data={},onSave,onDelete,onDup,mount,saveLabel}){
  openModal(title,`<form class="form" id="mform" novalidate>${fields.map(f=>fieldHTML(f,data[f.k])).join('')}</form>
  <div class="mfoot">${onDelete?`<button class="btn d" id="mdel">${ic('x',15)} 삭제</button>`:''}${onDup?'<button class="btn" id="mdup">복제</button>':''}<span class="sp"></span><button class="btn cancel" data-act="close">취소</button><button class="btn p" id="msave">${ic('ok',16)} ${saveLabel||'저장하기'}</button></div>`,root=>{
    const form=$('#mform',root);
    const vals=()=>readForm(form,fields);
    const applyShow=()=>{const v=vals();fields.forEach(f=>{if(!f.show)return;const el=form.querySelector(`[data-fk="${f.k}"]`);if(el)el.classList.toggle('hide',!f.show(v))})};
    form.addEventListener('click',e=>{
      const b=e.target.closest('.card-opt,.chip-opt');if(!b)return;
      const grp=b.parentElement;if(grp.dataset.free)return;
      grp.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      const inp=form.querySelector(`[name="${grp.dataset.for}"]`);if(inp){inp.value=b.dataset.v;inp.dispatchEvent(new Event('change',{bubbles:true}))}
    });
    form.addEventListener('change',applyShow);form.addEventListener('input',applyShow);
    const submit=()=>{
      const v=vals();
      for(const f of fields){if(!f.req)continue;if(f.show&&!f.show(v))continue;if(v[f.k]===''||v[f.k]==null){toast(`'${f.l}'을(를) 입력해 주세요`);const el=form.querySelector(`[name="${f.k}"]`);el&&el.focus&&el.focus();return}}
      if(onSave(v)===false)return;closeModal();
    };
    $('#msave',root).onclick=submit;
    form.addEventListener('submit',e=>{e.preventDefault();submit()});
    form.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!e.target.closest('.sugg-wrap')){e.preventDefault();submit()}});
    const del=$('#mdel',root);
    if(del)del.onclick=()=>{if(del.dataset.c){onDelete();closeModal()}else{del.dataset.c=1;del.innerHTML='정말 삭제할까요?';del.classList.add('danger')}};
    const dup=$('#mdup',root);if(dup)dup.onclick=()=>{const v=vals();closeModal();onDup(v)};
    mount&&mount(root,form);
    applyShow();
  },{icon,color,sub});
}
function setField(form,k,val){const el=form.querySelector(`[name="${k}"]`);if(!el)return;if(el.type==='checkbox')el.checked=!!val;else if(el.dataset.money!=null)el.value=val==null||val===''?'':Number(val).toLocaleString('ko-KR');else el.value=val??'';const grp=form.querySelector(`[data-for="${k}"]`);if(grp)grp.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===String(val??'')));el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}

/* ================= 자산: 계좌(은행/증권), 마이너스통장, 보유 종목 ================= */
const BANK_TYPES=['입출금','예·적금','청약','마이너스통장','외화','기타'];
const SEC_TYPES=['일반(위탁)','CMA','ISA','연금저축','IRP','기타'];
const acctKind=a=>a.kind||(['증권','CMA','ISA','연금','일반(위탁)','연금저축','IRP'].includes(a.type)?'sec':'bank');
let QUOTES={},quoteAt=0,quoteErr='',quoteLoading=false,quoteTry=0;
try{const q=JSON.parse(localStorage.getItem('pdash_quotes')||'null');if(q){QUOTES=q.prices||{};quoteAt=q.at||0}}catch(e){}
function holdPrice(h){const q=QUOTES[h.code];return q&&q.price?q.price:null}
function secValue(a){return (+a.cash||0)+sum(a.holdings||[],h=>(+h.qty||0)*(holdPrice(h)??(+h.avg||0)))}
function secCost(a){return sum(a.holdings||[],h=>(+h.qty||0)*(+h.avg||0))}
function secStock(a){return sum(a.holdings||[],h=>(+h.qty||0)*(holdPrice(h)??(+h.avg||0)))}
function acctValue(a){return acctKind(a)==='sec'?secValue(a):(+a.bal||0)}
async function refreshQuotes(force){
  const codes=[...new Set(S.finance.accounts.flatMap(a=>(a.holdings||[]).map(h=>h.code)).filter(c=>/^[0-9A-Z]{6}$/.test(c||'')))];
  if(!codes.length||quoteLoading)return;
  if(!force&&quoteAt&&Date.now()-quoteAt<5*60e3&&codes.every(c=>QUOTES[c]))return;
  if(!force&&Date.now()-quoteTry<60e3)return;
  quoteTry=Date.now();quoteLoading=true;if(curTab==='assets')renderQuoteStatus();
  try{
    const r=await fetch('/api/quote?codes='+codes.join(','));const j=await r.json();
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    Object.assign(QUOTES,j.prices||{});quoteAt=Date.now();quoteErr=(j.missing||[]).length?`${j.missing.length}개 종목 시세 없음`:'';
    try{localStorage.setItem('pdash_quotes',JSON.stringify({prices:QUOTES,at:quoteAt}))}catch(e){}
  }catch(e){quoteErr='시세 갱신 실패 — 마지막 시세(없으면 매입가)로 계산 중'}
  quoteLoading=false;
  if(['assets','home'].includes(curTab))renderAll(true);
}
function renderQuoteStatus(){const el=$('#qstat');if(el)el.innerHTML=quoteStatusHTML()}
function quoteStatusHTML(){
  if(quoteLoading)return `<span class="mut">시세 불러오는 중…</span>`;
  const t=quoteAt?new Date(quoteAt):null;
  return `${quoteErr?`<span style="color:var(--amb)">${esc(quoteErr)}</span>`:`<span class="mut">${t?`시세 ${t.getMonth()+1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())} 기준`:'시세 없음'}</span>`} <button class="ib" data-act="quote-refresh" title="시세 새로고침">${ic('refresh',15)}</button>`;
}
function finTotals(){
  const f=S.finance;let bank=0,sec=0,minus=0,minusW=0;
  f.accounts.forEach(a=>{const v=acctValue(a);if(v<0){minus+=-v;minusW+=(-v)*(+a.rate||0)}else if(acctKind(a)==='sec')sec+=v;else bank+=v});
  const ast=sum(f.assets,a=>a.value),manual=sum(f.debts,d=>d.bal),debt=manual+minus;
  const fixed=sum(f.fixed.filter(x=>x.active!==false),x=>x.amt),dpay=sum(f.debts,d=>d.pay);
  const avgRate=debt?(sum(f.debts,d=>(+d.bal||0)*(+d.rate||0))+minusW)/debt:0;
  return {acc:bank+sec,bank,sec,ast,total:bank+sec+ast,debt,minus,manual,net:bank+sec+ast-debt,fixed,dpay,avgRate};
}

function itemsOn(ds){

  const out=[];
  S.schedule.events.forEach(e=>{

    const c=evColor(e),timed=e.time&&!multi;
    let tm=null;if(timed){const s=toMin(e.time),en=toMin(e.endTime);tm={s,e:en&&en>s?en:Math.min(1440,s+60)}}
    const memo=(e.memo||'').split('\n')[0];

const chip=it=>`<span class="chip${it.done?' done':''}" style="background:${it.bg};border-left-color:${it.color}" data-act="item" data-k="${it.k}" data-id="${it.id}" title="${esc(it.label)}">${esc(it.label)}</span>`;

let cv={mode:curView()==='m'?'day':'week',anchor:new Date()},cvScroll=null;
const HH=46;
function layoutLanes(items){
  items.sort((a,b)=>a.tm.s-b.tm.s||b.tm.e-a.tm.e);
  const out=[];let cl=[],end=-1;
  const flush=()=>{const lanes=[];cl.forEach(it=>{let l=lanes.findIndex(e=>e<=it.tm.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=it.tm.e;it.lane=l});cl.forEach(it=>it.lanes=lanes.length);out.push(...cl);cl=[];end=-1};
  items.forEach(it=>{if(cl.length&&it.tm.s>=end)flush();cl.push(it);end=Math.max(end,it.tm.e)});
  if(cl.length)flush();return out;
}
function evBlock(it){
  const top=it.tm.s/60*HH,h=Math.max(22,(it.tm.e-it.tm.s)/60*HH-2),w=100/it.lanes;
  return `<div class="tev${it.done?' done':''}" data-act="item" data-k="${it.k}" data-id="${it.id}" style="top:${top+1}px;height:${h}px;left:calc(${it.lane*w}% + 3px);width:calc(${w}% - 6px);background:${it.bg};border-color:${it.color}" title="${esc(it.label)}"><b>${esc(it.title)}</b>${h>36&&it.sub?`<span>${esc(it.sub)}</span>`:''}</div>`;
}
function timeGrid(days,tall){

  const head=`<div class="tg-row tg-head" style="grid-template-columns:${cols}"><div></div>${days.map(ds=>{const w=parseD(ds).getDay();return `<div class="${ds===t?'today':''}${w===0?' sun':w===6?' sat':''}" data-act="cv-day" data-d="${ds}">${DOW[w]}<b>${md(ds).replace('/','.')}</b></div>`}).join('')}</div>`;
  const allRow=all.some(a=>a.some(x=>!x.tm))?`<div class="tg-row tg-all" style="grid-template-columns:${cols}"><div>종일</div>${all.map((a,i)=>`<div class="${days[i]===t?'today':''}">${a.filter(x=>!x.tm).map(chip).join('')}</div>`).join('')}</div>`:'';
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const lines=`background-image:repeating-linear-gradient(to bottom,var(--bd) 0 1px,transparent 1px ${HH}px)`;
  const body=`<div class="tg-scroll" id="tgs" style="height:${tall?620:300}px"><div class="tg-body" style="grid-template-columns:${cols};height:${24*HH}px">
    <div class="tg-gut">${[...Array(24)].map((_,h)=>`<div style="top:${h*HH}px">${pad(h)}:00</div>`).join('')}</div>
    ${days.map((ds,i)=>`<div class="tg-col${ds===t?' today':''}" data-act="slot" data-d="${ds}" style="${lines}">${layoutLanes(all[i].filter(x=>x.tm)).map(evBlock).join('')}${ds===t?`<div class="nowline" style="top:${nowM/60*HH}px"></div>`:''}</div>`).join('')}
  </div></div>`;
  return `<div class="tg">${head}${allRow}${body}</div>`;
}
function monthGrid(tall){
  const y=cv.anchor.getFullYear(),m=cv.anchor.getMonth(),first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((first.getDay()+dim)/7),start=new Date(y,m,1-first.getDay()),t=todayS(),maxC=tall?4:2;
  let c=DOW.map((w,i)=>`<div class="dow${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('');

  }
  return `<div class="mcal">${c}</div>`;
}

/* ================= 지표 계산 ================= */
function weekOfKeyMonth(key){const mo=parseD(key.slice(2));const th=addDays(mo,3);return `${th.getFullYear()}-${pad(th.getMonth()+1)}`}
function goalsOfMonth(ym){return S.goals.items.filter(g=>g.period==='M:'+ym||(g.scope==='week'&&(g.period||'').startsWith('W:')&&weekOfKeyMonth(g.period)===ym))}
function doneDates(){
  const s={};const add=d=>{if(d)s[d]=(s[d]||0)+1};
  S.schedule.todos.forEach(t=>t.done&&add(t.date));
  S.schedule.events.forEach(e=>e.done&&add(e.date));
  S.goals.items.forEach(g=>g.done&&add(g.doneAt));
  S.goals.items.forEach(g=>{if(g.gtype&&g.gtype!=='limit'&&g.gtype!=='check')(g.logs||[]).forEach(l=>add(l.d))});
  return s;
}
function streaks(){
  const s=doneDates();let d=new Date(),cur=0;
  if(!s[fmtD(d)])d=addDays(d,-1);
  while(s[fmtD(d)]){cur++;d=addDays(d,-1)}
  const ds=Object.keys(s).sort();let best=0,run=0,prev=null;
  ds.forEach(x=>{run=prev&&fmtD(addDays(parseD(prev),1))===x?run+1:1;best=Math.max(best,run);prev=x});
  return {cur,best,todayDone:!!s[todayS()]};
}

function barChart(rows,{fmt=v=>v,unit=''}={}){

}

function notifications(){
  const t=todayS(),tm=fmtD(addDays(new Date(),1)),out=[];
  [t,tm].forEach(ds=>itemsOn(ds).forEach(it=>{if(it.done||it.k==='fixed'||it.k==='debts')return;out.push({...it,ds})}));
  const td=S.schedule.todos.filter(x=>x.date===t&&!x.done).length;
  const dim=new Date(now.getFullYear(),new Date().getMonth()+1,0).getDate(),day=new Date().getDate();
  S.finance.fixed.forEach(f=>{if(f.active!==false&&f.day&&Math.min(+f.day,dim)===day)out.push({k:'fixed',id:f.id,label:'💳 오늘 결제: '+f.name+' '+won(f.amt)+'원',color:'#94a3b8',ds:t})});
  S.finance.debts.forEach(f=>{if(f.payday&&f.pay&&Math.min(+f.payday,dim)===day)out.push({k:'debts',id:f.id,label:'🏦 오늘 상환: '+f.name+' '+won(f.pay)+'원',color:'#94a3b8',ds:t})});
  return {list:out,td};
}

function openBell(){
  const n=notifications(),t=todayS(),dd=$('#ndd');
  dd.innerHTML=(n.td?`<div class="di" data-act="go" data-v="home"><span>📝</span><span style="flex:1">오늘 남은 할 일 ${n.td}개</span></div>`:'')+(n.list.length?n.list.map(x=>`<div class="di" data-act="item" data-k="${x.k}" data-id="${x.id}"><span class="dot" style="background:${x.color}"></span><span style="flex:1">${esc(x.label)}</span><span class="tag"${x.ds===t?' style="background:var(--pri);color:#fff"':''}>${x.ds===t?'오늘':'내일'}</span></div>`).join(''):'')||'<div class="de">오늘·내일 알림이 없습니다 🎉</div>';
  dd.classList.toggle('on');$('#sdd').classList.remove('on');
}

/* ================= 렌더 & 이벤트 ================= */
let pendingRender=false;
function renderAll(fromSnap){
  const ae=document.activeElement;
  if(fromSnap&&ae&&(ae.tagName==='TEXTAREA'||(ae.tagName==='INPUT'&&!['checkbox','range'].includes(ae.type)))&&$('#page').contains(ae)){pendingRender=true;return}
  if(fromSnap&&$('#modal').classList.contains('on')){pendingRender=true}
  pendingRender=false;
  const st=S.settings;
  $('#snav').innerHTML=PAGES.map(([k,l,i,sh])=>`<a href="#${k}" class="${curTab===k?'on':''}" title="${l}">${ic(i)}<span class="ln">${l}</span><span class="ls">${sh}</span></a>`).join('');
  $('#avatar').textContent=(st.name||'나').slice(-2);$('#myname').textContent=(st.name||'')+'님';
  $('#calbtn').innerHTML=ic('cal');renderBell();
  const P=PAGES.find(p=>p[0]===curTab);
  const SUB={goals:'주간·월간·연간 목표를 세우고 진행률을 관리해요.',schedule:'일정과 할 일을 한눈에 관리해요.',assets:'계좌·자산·부채와 고정지출을 정리해요.',ledger:'은행·카드 거래내역을 올리면 지출을 자동으로 분류하고 통계를 보여줘요.',ipo:'공모주 청약부터 배정·매도 손익까지 기록해요.',stats:'꾸준함과 성과를 숫자로 돌아봐요.',settings:'이름과 문구, 로그인 비밀번호, 표시 옵션을 바꿀 수 있어요.',life:'생애 단계별 목표로 인생의 큰 그림을 그려요.'};
  $('#tbl').innerHTML=curTab==='home'?`<h1>${esc(st.name)}님, 오늘도 힘내세요! 💪</h1><p>${esc(st.greet)}</p>`:`<h1>${P[1]}</h1><p>${SUB[curTab]}</p>`;
  $('#dl-broker').innerHTML=[...new Set([...S.ipo.brokers.map(b=>b.name),...BROKERS])].map(b=>`<option value="${esc(b)}">`).join('');
  $('#dl-inst-bank').innerHTML=[...new Set([...S.finance.accounts.filter(a=>acctKind(a)==='bank').map(a=>a.inst).filter(Boolean),...BANKS])].map(b=>`<option value="${esc(b)}">`).join('');
  $('#dl-inst').innerHTML=[...new Set([...S.finance.accounts.map(a=>a.inst).filter(Boolean),...BANKS,...BROKERS])].map(b=>`<option value="${esc(b)}">`).join('');
  const owners=new Set(['본인','배우자']);S.ipo.items.concat(S.finance.accounts).forEach(x=>x.owner&&owners.add(x.owner));$('#dl-owner').innerHTML=[...owners].map(o=>`<option value="${esc(o)}">`).join('');
  $('#logout').style.display='block';
  ({home:renderHome,life:renderLife,goals:renderGoals,schedule:renderSchedulePage,assets:renderAssets,ledger:renderLedger,ipo:renderIpo,stats:renderStats,settings:renderSettings})[curTab]();
  maybeLock();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!$('#modal').classList.contains('on'))renderAll()},50));
let noteT=null;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){doSearch(el.value);return}
  if(el.dataset.act==='gnote'){const k=el.dataset.k;S.goals.notes[k]=el.value;if(!el.value)delete S.goals.notes[k];clearTimeout(noteT);noteT=setTimeout(()=>save('goals'),800)}
  if(el.dataset.act==='lg-q'){clearTimeout(noteT);noteT=setTimeout(()=>{lgF.q=el.value;renderAll();const n=$('.lg-q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},350)}
  if(el.dataset.act==='gprog'){el.nextElementSibling&&(el.nextElementSibling.textContent=el.value+'%')}
});
$('#q').addEventListener('focus',e=>{if(e.target.value)doSearch(e.target.value)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';closeDD()}});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.classList.contains('tadd'))return;e.preventDefault();
  const inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;
  S.schedule.todos.push({id:newId(),date:f.dataset.date,text:v,done:false});save('schedule');renderAll();
  const nf=document.querySelector(`form.tadd[data-date="${f.dataset.date}"] input`);nf&&nf.focus();
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;
  if(a==='gprog'){const g=S.goals.items.find(x=>x.id===el.dataset.id);if(g){g.progress=Number(el.value);g.done=g.progress>=100;if(g.done)g.doneAt=g.doneAt||todayS();save('goals');renderAll()}}
  if(a==='gdone'){const g=S.goals.items.find(x=>x.id===el.dataset.id);if(g){g.done=el.checked;if(g.done){g.progress=100;g.doneAt=todayS()}save('goals');renderAll()}}
  if(a==='tdone'){const t=S.schedule.todos.find(x=>x.id===el.dataset.id);if(t){t.done=el.checked;save('schedule');renderAll()}}
  if(a==='evdone'){const ev=S.schedule.events.find(x=>x.id===el.dataset.id);if(ev){ev.done=el.checked;save('schedule');renderAll()}}
  if(a==='life-by'){const v=+el.value;S.life.birthYear=v>1900&&v<2100?v:null;save('life');renderAll()}
  if(a==='lgoal-done'){const g=S.life.goals.find(x=>x.id===el.dataset.id);if(g){g.done=el.checked;if(g.done)g.doneAt=todayS();save('life');renderAll()}}
  if(a==='mainbroker'){S.settings.mainBroker=el.value;save('settings');renderAll();toast(el.value?`주거래 증권사를 ${el.value}(으)로 정했어요`:'주거래 증권사를 해제했어요')}
  if(a==='opt'){S.settings[el.dataset.k]=el.checked;save('settings');renderAll()}
  if(a==='recur-cal'){const r=S.ledger.recur.find(x=>x.id===el.dataset.id);if(r){r.cal=el.checked;r.edited=true;save('ledger');renderAll();toast(r.cal?'캘린더에 표시해요':'캘린더에서 뺐어요')}}
  if(a==='lg-src'){lgF.src=el.value;renderAll()}
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.dd,#q,[data-act=bell]'))closeDD();
  if(e.target.closest('input[type=checkbox],input[type=range]'))return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  switch(a){
    case 'close':closeModal();break;
    case 'backup':openBackup();break;
    case 'go':closeModal();closeDD();if(location.hash==='#'+el.dataset.v){route();renderAll()}else location.hash=el.dataset.v;break;
    case 'bell':openBell();break;
    case 'cv-nav':{const v=+el.dataset.v,x=new Date(cv.anchor);if(cv.mode==='month'){x.setDate(1);x.setMonth(x.getMonth()+v)}else x.setDate(x.getDate()+(cv.mode==='week'?7:1)*v);cv.anchor=x;renderAll();break}
    case 'cv-today':cv.anchor=new Date();cvScroll=null;renderAll();break;
    case 'cv-mode':cv.mode=el.dataset.v;renderAll();break;
    case 'cv-month':cv.mode='month';cv.anchor=new Date();location.hash='schedule';break;
    case 'cv-day':closeModal();cv.mode='day';cv.anchor=parseD(el.dataset.d);sdate=el.dataset.d;renderAll();break;
    case 'cv-pick':pkY=null;openPicker();break;
    case 'pk-y':pkY+=+el.dataset.v;openPicker();break;
    case 'pk-m':{cv.anchor=new Date(pkY,+el.dataset.v,1);if(cv.mode!=='month')cv.mode='month';closeModal();renderAll();break}
    case 'slot':{const r=el.getBoundingClientRect(),h=Math.max(0,Math.min(23,Math.floor((e.clientY-r.top)/HH)));edit('events',null,{date:el.dataset.d,time:pad(h)+':00',endTime:pad(Math.min(23,h+1))+':00',cat:'업무'});break}
    case 'day':openDay(el.dataset.d);break;
    case 'add-ev':closeModal();edit('events',null,{date:el.dataset.d||(cv.mode==='day'?fmtD(cv.anchor):todayS()),cat:'업무'});break;
    case 'item':{e.stopPropagation();closeModal();closeDD();const k=el.dataset.k;edit(k==='ev'?'events':k,el.dataset.id);break}
    case 'edit':closeDD();edit(el.dataset.l,el.dataset.id);break;
    case 'add':edit(el.dataset.l,null,el.dataset.l==='ipo'?{owner:'본인'}:el.dataset.l==='fixed'?{active:true}:{});break;
    case 'todo-go':closeDD();sdate=el.dataset.d;location.hash='schedule';break;
    case 'sd-nav':{const v=+el.dataset.v;sdate=v===0?todayS():fmtD(addDays(parseD(sdate),v));renderAll();break}
    case 'tdel':{const L=S.schedule.todos,i=L.findIndex(x=>x.id===el.dataset.id);if(i>=0){L.splice(i,1);save('schedule');renderAll()}break}
    case 'set-save':{const f=$('#setform');const v={name:f.name.value.trim()||'나',greet:f.greet.value.trim(),quote:f.quote.value,showIpo:f.showIpo.checked,showFixed:f.showFixed.checked,showRecur:f.showRecur.checked,updWarn:Math.max(1,+f.updWarn.value||30)};Object.assign(S.settings,v);save('settings');renderAll();toast('설정을 저장했습니다');break}
    case 'goal-year':gp.scope='year';gp.anchor=new Date();edit('goals',null,{progress:0,cat:'재무'},{scope:'year',period:'Y:'+new Date().getFullYear()});break;
    case 'gscope':gp.scope=el.dataset.v;renderAll();break;
    case 'gnav':{const v=+el.dataset.v;gp.anchor=v===0?new Date():shiftAnchor(gp.scope,gp.anchor,v);renderAll();break}
    case 'add-goal':{const P=periodOf(gp.scope,gp.anchor);edit('goals',null,{progress:0,cat:'업무'},{scope:gp.scope,period:P.key});break}
    case 'gcarry':{const P=periodOf(gp.scope,gp.anchor),pk=periodOf(gp.scope,shiftAnchor(gp.scope,gp.anchor,-1)).key;
      const src=S.goals.items.filter(g=>g.period===pk&&!gDone(g));let n=0;
      src.forEach(g=>{if(!S.goals.items.some(x=>x.period===P.key&&x.text===g.text)){{const b=keyBounds(P.key);S.goals.items.push({...clone(g),id:newId(),period:P.key,start:b.s,end:b.e,logs:[],done:false})};n++}});
      save('goals');renderAll();toast(n?`${n}개를 가져왔습니다`:'이미 모두 가져왔습니다');break}
    case 'snap':{const T=finTotals(),m=todayS().slice(0,7);const s=S.finance.snapshots;const ex=s.find(x=>x.month===m);const v={month:m,assets:T.total,debts:T.debt,net:T.net,at:todayS()};if(ex)Object.assign(ex,v);else s.push(v);save('finance');renderAll();toast(`${m} 순자산을 기록했습니다`);break}
    case 'delsnap':{e.stopPropagation();if(!el.dataset.c){el.dataset.c=1;el.textContent='확인';return}const s=S.finance.snapshots;const i=s.findIndex(x=>x.month===el.dataset.m);if(i>=0){s.splice(i,1);save('finance');renderAll()}break}
    case 'lock':e.stopPropagation();lockNow();break;
    case 'au-mode':authMode=el.dataset.v;renderAuthCard();break;
    case 'au-resend':resendSignup();break;
    case 'au-eye':{const i=document.getElementById(el.dataset.for);if(i)i.type=i.type==='password'?'text':'password';break}
    case 'pw-save':pwAction();break;
    case 'view':setView(el.dataset.v);break;
    case 'life-tpl':S.life.stages=lifeTemplate();save('life');renderAll();toast('기본 생애 단계를 만들었습니다. 자유롭게 수정하세요');break;
    case 'stage-add':editStage(null);break;
    case 'stage-edit':editStage(el.dataset.id);break;
    case 'lstage-jump':{const t=document.getElementById('ls-'+el.dataset.id);t&&t.scrollIntoView({behavior:'smooth',block:'center'});break}
    case 'lgoal-add':editLGoal(null,el.dataset.id);break;
    case 'lgoal-edit':e.stopPropagation();editLGoal(el.dataset.id);break;
    case 'fam-add':editFamily(null);break;
    case 'fam-edit':editFamily(el.dataset.id);break;
    case 'acc-add':editAccount(null,{kind:el.dataset.k});break;
    case 'hold-add':editHolding(el.dataset.acc,null);break;
    case 'hold-edit':editHolding(el.dataset.acc,el.dataset.id);break;
    case 'quote-refresh':refreshQuotes(true);break;
    case 'sec-toggle':{const ac=S.finance.accounts.find(x=>x.id===el.dataset.id);if(ac){secOpen[ac.id]=!secIsOpen(ac);try{localStorage.setItem('pdash_secopen',JSON.stringify(secOpen))}catch(err){}renderAll()}break}
    case 'copy':{e.stopPropagation();const v=el.dataset.v;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('계좌번호를 복사했어요')).catch(()=>{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('계좌번호를 복사했어요')}catch(x){toast(v)}t.remove()});break}
    case 'ipo-sub':subscribeIpo(el.dataset.id);break;
    case 'ipo-hide':case 'ipo-unhide':{const h=new Set(S.ipo.hidden||[]);a==='ipo-hide'?h.add(el.dataset.id):h.delete(el.dataset.id);S.ipo.hidden=[...h];save('ipo');renderAll();if(a==='ipo-hide')toast('숨겼어요. 상단 ‘숨긴 종목’에서 다시 볼 수 있어요');break}
    case 'ipo-showhidden':ipoF.showHidden=!ipoF.showHidden;renderAll();break;
    case 'ipo-refresh':loadIpoCal(true);break;
    case 'broker-edit':editBroker(null,{name:el.dataset.name});break;
    case 'grec':openRecord(el.dataset.id);break;
    case 'grec1':{const g=S.goals.items.find(x=>x.id===el.dataset.id);if(g){g.logs=g.logs||[];g.logs.push({id:newId(),d:todayS(),n:1});save('goals');renderAll();toast(`오늘 1${g.unit||'회'} 기록 · 성공률 ${gPct(g)}%`)}break}
    case 'glog-del':{const g=S.goals.items.find(x=>x.id===el.dataset.g);if(g){g.logs=(g.logs||[]).filter(l=>l.id!==el.dataset.id);save('goals');closeModal();renderAll();openRecord(g.id)}break}
    case 'ipoy':ipoF.y=el.dataset.v;renderAll();break;
    case 'lg-up':openUpload();break;
    case 'up-pick':{const f=$('#upf');f&&f.click();break}
    case 'lg-m':lgF.ym=el.dataset.v;renderAll();break;
    case 'lg-cat':lgF.cat=lgF.cat===el.dataset.v?'':el.dataset.v;if(lgF.cat)lgF.type='exp';renderAll();break;
    case 'lg-type':lgF.type=el.dataset.v;renderAll();break;
    case 'lg-ign':lgF.showIgn=!lgF.showIgn;renderAll();break;
    case 'tx-edit':editTx(el.dataset.id);break;
    case 'recur-edit':editRecur(el.dataset.id);break;
    case 'recur-restore':{e.stopPropagation();const r=S.ledger.recur.find(x=>x.id===el.dataset.id);if(r){r.ign=false;save('ledger');renderAll();toast('정기 출금으로 되돌렸어요')}break}
    case 'imp-del':{if(!el.dataset.c){el.dataset.c=1;el.textContent='거래도 함께 삭제돼요 · 확인';return}const id=el.dataset.id;const L=S.ledger;const n=L.tx.length;L.tx=L.tx.filter(t=>t.imp!==id);L.imports=L.imports.filter(i=>i.id!==id);lgDetectRecur();save('ledger');renderAll();toast(`${n-L.tx.length}건을 삭제했어요`);break}
    case 'ipos':ipoF.st=el.dataset.v;renderAll();break;
  }
});
/* ================= 라이프 플랜 ================= */
const LCATS={재무:['💰','#8b5cf6'],커리어:['💼','#3b7cf5'],가족:['👨‍👩‍👧','#f97316'],건강:['🏃','#20a464'],주거:['🏠','#0ea5e9'],교육:['🎓','#14b8a6'],여가:['✈️','#e11d48'],기타:['⭐','#64748b']};
const STAGE_COLORS=['#3b7cf5','#8b5cf6','#20a464','#f97316','#e11d48','#0ea5e9','#14b8a6','#64748b'];
F.stage=[{k:'name',l:'단계 이름',t:'text',req:1,ph:'예: 기반 다지기'},{k:'from',l:'시작 나이',t:'num',req:1,h:1,min:0,max:120},{k:'to',l:'끝 나이',t:'num',req:1,h:1,min:0,max:120},{k:'theme',l:'이 시기의 핵심 테마',t:'area',ph:'예: 커리어 성장, 종잣돈 마련, 내 집 마련 준비'}];
F.family=[{k:'name',l:'이름/호칭',t:'text',req:1,h:1,ph:'예: 아내, 첫째'},{k:'birthYear',l:'출생연도',t:'num',req:1,h:1,min:1900,max:2100}];
const lifeAge=()=>{const by=+S.life.birthYear;return by?new Date().getFullYear()-by:null};
function lgoalFields(){return [{k:'text',l:'목표',t:'text',req:1},{k:'stage',l:'생애 단계',t:'sel',o:S.life.stages.slice().sort((a,b)=>a.from-b.from).map(s=>s.name),h:1},{k:'cat',l:'분류',t:'sel',o:Object.keys(LCATS),h:1},{k:'targetAge',l:'목표 나이',t:'num',h:1,min:0,max:120},{k:'amount',l:'목표 금액 (선택)',t:'money',h:1},{k:'memo',l:'메모 · 실행 계획',t:'area'},{k:'done',l:'달성',t:'check'}]}
function editLGoal(id,stageId){
  const L=S.life,item=id?L.goals.find(g=>g.id===id):null;if(id&&!item)return;
  const st=L.stages.find(s=>s.id===(item?item.stageId:stageId));
  const data=item?{...item,stage:st&&st.name}:{stage:st&&st.name,cat:'재무',targetAge:st?st.from:null};
  openForm({title:'라이프 목표'+(item?' 수정':' 추가'),sub:META.life.sub,icon:'map',color:'#14b8a6',fields:lgoalFields(),data,
    onSave:v=>{const s=L.stages.find(x=>x.name===v.stage);v.stageId=s?s.id:(st&&st.id);delete v.stage;if(v.done&&!(item&&item.doneAt))v.doneAt=todayS();if(item)Object.assign(item,v);else L.goals.push({id:newId(),...v});save('life');renderAll();toast('저장했습니다')},
    onDelete:item?()=>{L.goals.splice(L.goals.indexOf(item),1);save('life');renderAll()}:null});
}
function editStage(id){
  const L=S.life,item=id?L.stages.find(s=>s.id===id):null;
  const last=L.stages.reduce((m,s)=>Math.max(m,+s.to||0),0);
  openForm({title:'생애 단계'+(item?' 수정':' 추가'),sub:'나이 구간과 이 시기의 핵심 테마를 정해요',icon:'layers',color:'#14b8a6',fields:F.stage,data:item||{from:last?last+1:(lifeAge()||30),to:(last?last+10:(lifeAge()||30)+9)},
    onSave:v=>{if(v.to<v.from){toast('끝 나이가 시작 나이보다 작아요');return}if(item)Object.assign(item,v);else L.stages.push({id:newId(),color:STAGE_COLORS[L.stages.length%STAGE_COLORS.length],...v});save('life');renderAll()},
    onDelete:item?()=>{const n=L.goals.filter(g=>g.stageId===item.id).length;L.stages.splice(L.stages.indexOf(item),1);L.goals=L.goals.filter(g=>g.stageId!==item.id);save('life');renderAll();if(n)toast(`단계와 목표 ${n}개를 삭제했습니다`)}:null});
}
function editFamily(id){
  const L=S.life,item=id?L.family.find(f=>f.id===id):null;
  openForm({title:'가족'+(item?' 수정':' 추가'),sub:'단계별로 가족의 나이가 함께 표시돼요',icon:'user',color:'#f97316',fields:F.family,data:item||{},
    onSave:v=>{if(item)Object.assign(item,v);else L.family.push({id:newId(),...v});save('life');renderAll()},
    onDelete:item?()=>{L.family.splice(L.family.indexOf(item),1);save('life');renderAll()}:null});
}
function lifeTemplate(){
  const a=lifeAge()||30;
  const T=[[20,29,'출발',"학업·첫 직장, 저축 습관, 자기계발"],[30,39,'기반 다지기','커리어 성장, 종잣돈·내 집 마련, 가정 꾸리기'],[40,49,'성장·자산 증식','소득 극대화, 자산 증식, 자녀 교육 준비'],[50,59,'안정·확장','부채 정리, 노후자금 본격 마련, 건강 관리'],[60,69,'은퇴 전환','은퇴 설계, 연금 수령 계획, 제2의 일'],[70,100,'여유로운 노후','건강, 여가, 가족과의 시간, 자산 승계']];
  return T.filter(t=>t[1]>=a).map((t,i)=>({id:newId(),from:t[0],to:t[1],name:t[2],theme:t[3],color:STAGE_COLORS[i%STAGE_COLORS.length]}));
}
function renderLife(){
  const L=S.life,by=+L.birthYear||null,age=lifeAge(),cy=new Date().getFullYear();
  const stages=L.stages.slice().sort((a,b)=>a.from-b.from);
  const goals=L.goals,done=goals.filter(g=>g.done).length;
  const next=goals.filter(g=>!g.done&&g.targetAge!=null&&(age==null||g.targetAge>=age)).sort((a,b)=>a.targetAge-b.targetAge)[0];
  const yr=a=>by?by+(+a):null;
  const head=`<div class="card"><div class="row" style="gap:18px;align-items:flex-end">
    <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)">내 출생연도<input type="number" data-act="life-by" value="${by||''}" placeholder="예: 1985" style="width:120px;border:1px solid var(--bd);border-radius:9px;padding:7px 10px"></label>
    <div><div class="mut" style="font-size:12px">올해 나이</div><div style="font-size:22px;font-weight:800">${age!=null?age+'세':'-'}</div></div>
    <div style="flex:1;min-width:200px"><div class="mut" style="font-size:12px;margin-bottom:4px">함께하는 가족 <span class="mut" style="font-size:11px">(단계별로 가족 나이가 표시돼요)</span></div><div class="row">${L.family.map(f=>`<button class="btn s" data-act="fam-edit" data-id="${f.id}">${esc(f.name)} · ${f.birthYear?cy-f.birthYear+'세':''}</button>`).join('')}<button class="btn s" data-act="fam-add">+ 가족 추가</button></div></div>
  </div><div class="mut" style="font-size:11.5px;margin-top:8px">나이는 ‘올해 연도 − 출생연도’로 계산한 만 나이 기준(생일 전이면 1살 적음)입니다.</div></div>`;
  if(!stages.length){
    $('#page').innerHTML=head+`<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:40px">🗺️</div><h3 style="justify-content:center;font-size:18px">인생 지도를 그려 볼까요?</h3><p class="mut">생애 단계(예: 30대 기반 다지기, 40대 자산 증식…)를 나누고 단계별 목표를 적어 보세요.${by?'':'<br>먼저 위에 출생연도를 입력하면 연도가 함께 계산됩니다.'}</p>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn p" data-act="life-tpl">기본 생애 단계로 시작</button><button class="btn" data-act="stage-add">직접 단계 추가</button></div></div>`;return;
  }
  const minA=stages[0].from,maxA=Math.max(...stages.map(s=>+s.to)),span=Math.max(1,maxA-minA+1);
  const tl=`<div class="card"><div class="ch"><h3>🗺️ 나의 생애 타임라인</h3><button class="btn s" data-act="stage-add">+ 단계 추가</button></div>
    <div class="ltl">${stages.map(s=>`<div class="lseg" style="width:${(s.to-s.from+1)/span*100}%;background:${s.color}" data-act="lstage-jump" data-id="${s.id}" title="${esc(s.name)}"><b>${esc(s.name)}</b><small>${s.from}–${s.to}세${by?` · ${yr(s.from)}–${yr(s.to)}`:''}</small></div>`).join('')}
    ${age!=null&&age>=minA&&age<=maxA?`<div class="lnow" style="left:${(age-minA+.5)/span*100}%"><span>지금 ${age}세</span></div>`:''}
    ${goals.filter(g=>g.targetAge!=null&&g.targetAge>=minA&&g.targetAge<=maxA).map(g=>`<i class="lpin${g.done?' done':''}" style="left:${(g.targetAge-minA+.5)/span*100}%" title="${esc(g.text)} (${g.targetAge}세)" data-act="lgoal-edit" data-id="${g.id}"></i>`).join('')}
    </div>
    <div class="row mut" style="font-size:12.5px;margin-top:34px;gap:18px"><span>전체 목표 <b style="color:var(--tx)">${goals.length}</b>개</span><span>달성 <b style="color:var(--tx)">${done}</b>개</span>${next?`<span>다음 목표: <b style="color:var(--tx)">${esc(next.text)}</b> (${next.targetAge}세${by?', '+yr(next.targetAge)+'년':''}${age!=null?` · ${next.targetAge-age}년 남음`:''})</span>`:''}</div></div>`;
  const cards=stages.map(s=>{
    const gs=goals.filter(g=>g.stageId===s.id).sort((a,b)=>(a.targetAge??999)-(b.targetAge??999));
    const gd=gs.filter(g=>g.done).length,cur=age!=null&&age>=s.from&&age<=s.to,past=age!=null&&age>s.to;
    const fam=L.family.filter(f=>f.birthYear&&by).map(f=>{const a1=yr(s.from)-f.birthYear,a2=yr(s.to)-f.birthYear;return a2<0?null:`${esc(f.name)} ${Math.max(0,a1)}–${a2}세`}).filter(Boolean);
    return `<div class="card lstage${cur?' cur':''}${past?' past':''}" id="ls-${s.id}" style="border-top:4px solid ${s.color}">
      <div class="ch"><h3><span style="color:${s.color}">●</span> ${esc(s.name)} ${cur?'<span class="tag" style="background:var(--pri);color:#fff">지금</span>':past?'<span class="tag">지난 단계</span>':''}</h3><button class="btn s ghost" data-act="stage-edit" data-id="${s.id}">수정</button></div>
      <div class="mut" style="font-size:12.5px;margin-top:-6px">${s.from}–${s.to}세${by?` · ${yr(s.from)}–${yr(s.to)}년`:''}${cur&&age!=null?` · ${s.to-age}년 남음`:''}</div>
      ${fam.length?`<div style="font-size:12px;margin-top:4px;color:#4a5468">👨‍👩‍👧 ${fam.join(' · ')}</div>`:''}
      ${s.theme?`<div class="ltheme">${esc(s.theme)}</div>`:''}
      ${gs.length?`<div class="row" style="flex-wrap:nowrap;margin:4px 0 6px"><div class="bar" style="flex:1"><i style="width:${gd/gs.length*100}%;background:${s.color}"></i></div><span class="mut" style="font-size:12px">${gd}/${gs.length}</span></div>`:''}
      <ul class="todo">${gs.map(g=>{const c=LCATS[g.cat]||LCATS['기타'];return `<li class="${g.done?'done':''}"><input type="checkbox" data-act="lgoal-done" data-id="${g.id}"${g.done?' checked':''}><span style="flex:1;min-width:0;cursor:pointer" data-act="lgoal-edit" data-id="${g.id}"><span class="tt">${c[0]} ${esc(g.text)}</span><span class="mut" style="font-size:11.5px;display:block">${g.targetAge!=null?`${g.targetAge}세${by?' ('+yr(g.targetAge)+')':''}`:''}${g.amount?` · 목표 ${short(g.amount)}원`:''}${g.memo?` · ${esc(g.memo.split('\n')[0])}`:''}</span></span></li>`}).join('')}</ul>
      <button class="btn s" style="margin-top:6px" data-act="lgoal-add" data-id="${s.id}">+ 목표 추가</button></div>`;
  }).join('');
  $('#page').innerHTML=head+tl+`<div class="lgrid">${cards}</div>`;
}

function showAuth(m){if(m)authMode=m;renderAuthCard();$('#auth').classList.add('on')}
function hideAuth(){$('#auth').classList.remove('on')}
function maybeLock(){if(mode==='auth'&&!$('#auth').classList.contains('on'))showAuth()}
async function lockNow(){try{await sb.auth.signOut({scope:'local'})}catch(e){}try{localStorage.removeItem('pdash_nokeep')}catch(e){}endSession()}
const auErr=m=>{const e=$('#au-err');if(e)e.textContent=m};
const redirectUrl=()=>location.origin+location.pathname;
async function authSubmit(kind){
  if(authBusy)return;
  const v=id=>{const e=$('#'+id);return e?e.value:''};
  const btn=document.querySelector('.au-form .au-btn'),label=btn&&btn.textContent;
  const busy=b=>{authBusy=b;if(btn){btn.disabled=b;btn.textContent=b?'처리 중…':label;btn.style.opacity=b?.7:1}};
  try{
    if(kind==='login'){
      const em=v('au-email').trim(),pw=v('au-pw');
      if(!em||!pw)return auErr('이메일과 비밀번호를 입력해 주세요');
      busy(true);
      const keep=$('#au-keep').checked;
      const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error){busy(false);if((error.message||'').startsWith('Email not confirmed')){sentTo=em;auErr(krErr(error));const a=document.createElement('a');a.textContent=' 인증 메일 다시 보내기';a.dataset.act='au-resend';a.style.cssText='color:#3d7cf6;cursor:pointer';$('#au-err').appendChild(a);return}return auErr(krErr(error))}
      try{localStorage.setItem('pdash_lastEmail',em);if(keep)localStorage.removeItem('pdash_nokeep');else{localStorage.setItem('pdash_nokeep','1');sessionStorage.setItem('pdash_alive','1')}}catch(e){}
      busy(false);await startSession(data.user);toast('로그인했습니다');
    }else if(kind==='signup'){
      const name=v('au-name').trim(),em=v('au-email').trim(),pw=v('au-pw'),pw2=v('au-pw2');
      if(!name)return auErr('이름을 입력해 주세요');
      if(!validEmail(em))return auErr('올바른 이메일 주소를 입력해 주세요');
      if(pw.length<8)return auErr('비밀번호는 8자 이상으로 정해 주세요');
      if(pw!==pw2)return auErr('비밀번호 확인이 일치하지 않습니다');
      busy(true);
      const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name},emailRedirectTo:redirectUrl()}});
      busy(false);
      if(error)return auErr(krErr(error));
      if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return auErr('이미 가입된 이메일입니다. 로그인해 주세요');
      try{localStorage.setItem('pdash_lastEmail',em)}catch(e){}
      if(data.session){await startSession(data.user);toast(`${name}님, 가입을 환영합니다!`)}
      else{sentTo=em;showAuth('sent')}
    }else if(kind==='reset1'){
      const em=v('au-email').trim();
      if(!validEmail(em))return auErr('올바른 이메일 주소를 입력해 주세요');
      busy(true);const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:redirectUrl()});busy(false);
      if(error)return auErr(krErr(error));
      sentTo=em;showAuth('resetSent');
    }else if(kind==='reset2'){
      const pw=v('au-pw'),pw2=v('au-pw2');
      if(pw.length<8)return auErr('비밀번호는 8자 이상으로 정해 주세요');
      if(pw!==pw2)return auErr('비밀번호 확인이 일치하지 않습니다');
      busy(true);const {data,error}=await sb.auth.updateUser({password:pw});busy(false);
      if(error)return auErr(krErr(error));
      recovering=false;await startSession(data.user);toast('비밀번호를 변경했습니다');
    }
  }catch(e){busy(false);auErr(krErr(e))}
}
async function resendSignup(){
  if(!sentTo)return;
  const {error}=await sb.auth.resend({type:'signup',email:sentTo,options:{emailRedirectTo:redirectUrl()}});
  toast(error?krErr(error):'인증 메일을 다시 보냈습니다');
}

['mousedown','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));

const idleOut=()=>{const m=+S.settings.autoLock||0;return mode==='db'&&m&&!isKept()&&Date.now()-lastAct>m*60000};

function securityCard(){

    <p style="margin-top:0;font-size:13px">로그인 이메일 <b>${esc(u.email||'')}</b>${u.created_at?` <span class="mut">· ${u.created_at.slice(0,10)} 가입</span>`:''}${u.new_email?`<br><span class="mut">변경 대기 중: ${esc(u.new_email)} (인증 메일 확인 필요)</span>`:''}</p>
    <form class="form" id="pwform" onsubmit="return false">
      <label>현재 비밀번호 (이메일·비밀번호 변경 시 필요)<input type="password" name="cur" autocomplete="current-password"></label>
      <label>새 이메일 (바꿀 때만 — 새 주소로 인증 메일이 갑니다)<input type="email" name="email" placeholder="${esc(u.email||'')}" autocomplete="email"></label>
      <label class="h">새 비밀번호 (바꿀 때만)<input type="password" name="pw" autocomplete="new-password"></label>
      <label class="h">새 비밀번호 확인<input type="password" name="pw2" autocomplete="new-password"></label>
      <label>자동 로그아웃 <span class="hint">‘로그인 상태 유지’를 끄고 로그인했을 때만 적용돼요</span><select name="auto">${[[0,'사용 안 함'],[5,'5분 동안 사용하지 않으면'],[15,'15분 동안 사용하지 않으면'],[30,'30분 동안 사용하지 않으면'],[60,'1시간 동안 사용하지 않으면']].map(([v,l])=>`<option value="${v}"${+st.autoLock===v?' selected':''}>${l}</option>`).join('')}</select></label>
    </form>
    <div class="mfoot"><button class="btn" data-act="lock">로그아웃</button><span class="sp"></span><button class="btn p" data-act="pw-save">변경 저장</button></div></div>`;
}
async function pwAction(){
  const f=$('#pwform'),st=S.settings,em=f.email.value.trim(),pw=f.pw.value;
  if(em||pw){
    if(!f.cur.value){toast('현재 비밀번호를 입력해 주세요');return}
    const {error}=await sb.auth.signInWithPassword({email:sbUser.email,password:f.cur.value});
    if(error){toast('현재 비밀번호가 맞지 않습니다');return}
  }
  if(em&&!validEmail(em)){toast('올바른 이메일 주소를 입력해 주세요');return}
  if(pw){if(pw.length<8){toast('비밀번호는 8자 이상으로 정해 주세요');return}if(pw!==f.pw2.value){toast('새 비밀번호 확인이 일치하지 않습니다');return}}
  const upd={};if(em)upd.email=em;if(pw)upd.password=pw;
  if(Object.keys(upd).length){const {data,error}=await sb.auth.updateUser(upd,{emailRedirectTo:redirectUrl()});if(error){toast(krErr(error));return}if(data&&data.user)sbUser=data.user}
  st.autoLock=+f.auto.value;save('settings');renderAll();
  toast(em?'새 이메일로 인증 메일을 보냈습니다. 확인하면 변경이 완료됩니다':'저장했습니다');
}

init();

</script>
</body>
</html>
